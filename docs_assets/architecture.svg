<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#475569;stroke-width:1.3;rx:6}
      .grp{fill:none;stroke:#94a3b8;stroke-dasharray:5 4;rx:10}
      .t{font-weight:bold;fill:#0f172a}
      .s{fill:#475569;font-size:11px}
      .g{fill:#64748b;font-size:12px;font-weight:bold;letter-spacing:1px}
      line,path.l{stroke:#475569;stroke-width:1.3;marker-end:url(#a);fill:none}
    </style>
  </defs>

  <!-- Data layer -->
  <rect class="grp" x="10" y="10" width="190" height="450"/>
  <text class="g" x="22" y="32">DATA</text>
  <rect class="box" x="25" y="50" width="160" height="62"/>
  <text class="t" x="35" y="74">Synthetic generator</text>
  <text class="s" x="35" y="94">synthetic.py (4 racks,</text>
  <text class="s" x="35" y="107">tenants A–F, 2 years)</text>
  <rect class="box" x="25" y="130" width="160" height="62"/>
  <text class="t" x="35" y="154">Real records</text>
  <text class="s" x="35" y="174">raw_data/dc_m100,</text>
  <text class="s" x="35" y="187">dc_alibaba (CSV)</text>
  <rect class="box" x="25" y="210" width="160" height="62"/>
  <text class="t" x="35" y="234">config.py</text>
  <text class="s" x="35" y="254">column mapping, limits,</text>
  <text class="s" x="35" y="267">thresholds</text>
  <rect class="box" x="25" y="370" width="160" height="62"/>
  <text class="t" x="35" y="394">Audit log</text>
  <text class="s" x="35" y="414">audit/*.jsonl</text>
  <text class="s" x="35" y="427">(append-only)</text>

  <!-- Pipeline -->
  <rect class="grp" x="220" y="10" width="440" height="450"/>
  <text class="g" x="232" y="32">BACKEND · pipeline/ (Python)</text>
  <rect class="box" x="235" y="50" width="130" height="50"/><text class="t" x="245" y="72">loader</text><text class="s" x="245" y="89">map → canonical</text>
  <rect class="box" x="235" y="120" width="130" height="50"/><text class="t" x="245" y="142">clean</text><text class="s" x="245" y="159">daily, fill gaps</text>
  <rect class="box" x="235" y="190" width="130" height="50"/><text class="t" x="245" y="212">changepoints</text><text class="s" x="245" y="229">ruptures PELT</text>
  <rect class="box" x="235" y="260" width="130" height="50"/><text class="t" x="245" y="282">forecast</text><text class="s" x="245" y="299">trend + P10/P50/P90</text>
  <rect class="box" x="235" y="330" width="130" height="50"/><text class="t" x="245" y="352">exhaustion</text><text class="s" x="245" y="369">ETA to safe limit</text>

  <rect class="box" x="400" y="190" width="120" height="120"/>
  <text class="t" x="430" y="240">engine</text>
  <text class="s" x="410" y="260">one entry point for</text>
  <text class="s" x="410" y="274">app + backtest</text>

  <rect class="box" x="545" y="50" width="105" height="50"/><text class="t" x="555" y="72">alerts</text><text class="s" x="555" y="89">3-run confirm</text>
  <rect class="box" x="545" y="120" width="105" height="50"/><text class="t" x="555" y="142">confidence</text><text class="s" x="555" y="159">0–100 score</text>
  <rect class="box" x="545" y="190" width="105" height="50"/><text class="t" x="555" y="212">attribution</text><text class="s" x="555" y="229">tenant driver</text>
  <rect class="box" x="545" y="260" width="105" height="50"/><text class="t" x="555" y="282">recommend</text><text class="s" x="555" y="299">actions + effects</text>
  <rect class="box" x="545" y="330" width="105" height="50"/><text class="t" x="555" y="352">backtest</text><text class="s" x="555" y="369">daily replay</text>
  <rect class="box" x="400" y="390" width="120" height="50"/><text class="t" x="430" y="412">audit</text><text class="s" x="410" y="429">writes every run</text>

  <!-- Frontend -->
  <rect class="grp" x="680" y="10" width="210" height="450"/>
  <text class="g" x="692" y="32">FRONTEND · Streamlit</text>
  <rect class="box" x="695" y="50" width="180" height="230"/>
  <text class="t" x="705" y="74">app.py (Operator)</text>
  <text class="s" x="705" y="96">• Capacity outlook chart</text>
  <text class="s" x="705" y="114">• Overview + plan</text>
  <text class="s" x="705" y="132">• Resource detail</text>
  <text class="s" x="705" y="150">• Recommendations</text>
  <text class="s" x="705" y="168">• Validation (backtest)</text>
  <text class="s" x="705" y="186">• Audit log</text>
  <text class="s" x="705" y="214">Plotly charts,</text>
  <text class="s" x="705" y="228">ui_story / ui_fx visuals</text>
  <rect class="box" x="695" y="300" width="180" height="80"/>
  <text class="t" x="705" y="324">Tenant view</text>
  <text class="s" x="705" y="344">own series only,</text>
  <text class="s" x="705" y="358">filtered before compute</text>

  <!-- arrows -->
  <line x1="185" y1="81" x2="233" y2="75"/>
  <line x1="185" y1="161" x2="233" y2="80"/>
  <line x1="185" y1="241" x2="233" y2="85"/>
  <line x1="300" y1="100" x2="300" y2="118"/>
  <line x1="300" y1="170" x2="300" y2="188"/>
  <line x1="300" y1="240" x2="300" y2="258"/>
  <line x1="300" y1="310" x2="300" y2="328"/>
  <line x1="365" y1="355" x2="398" y2="290"/>
  <line x1="520" y1="220" x2="543" y2="80"/>
  <line x1="520" y1="235" x2="543" y2="148"/>
  <line x1="520" y1="250" x2="543" y2="215"/>
  <line x1="520" y1="270" x2="543" y2="285"/>
  <line x1="520" y1="290" x2="543" y2="350"/>
  <line x1="460" y1="310" x2="460" y2="388"/>
  <line x1="400" y1="415" x2="187" y2="401"/>
  <line x1="650" y1="160" x2="693" y2="160"/>
  <line x1="650" y1="300" x2="693" y2="335"/>
</svg>
