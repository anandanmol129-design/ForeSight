# NOC / mission-control look: pure black and white, status colours only for signal, Space Grotesk +
# Inter + JetBrains Mono. HUD details (brackets, glow, motion) live in assets/style.css.
# Locked to dark: the Plotly figures and the 3D hall in ui_fx.py are styled for this palette.
[client]
toolbarMode = "viewer"

[theme]
base = "dark"
primaryColor = "#f2f2f2"
backgroundColor = "#050505"
secondaryBackgroundColor = "#0d0d0d"
textColor = "#e5e5e5"
linkColor = "#e5e5e5"
borderColor = "#262626"
codeBackgroundColor = "#0a0a0a"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.25rem"
buttonRadius = "0.2rem"
baseFontSize = 14
headingFontSizes = ["2.3rem", "1.25rem", "1rem"]
headingFontWeights = [600, 600, 600]
metricValueFontSize = "2.1rem"
metricValueFontWeight = 600
linkUnderline = false
paddingTop = "1rem"
redColor = "#f43f5e"
orangeColor = "#f59e0b"
yellowColor = "#facc15"
blueColor = "#3b82f6"
greenColor = "#10b981"
violetColor = "#8b5cf6"
grayColor = "#8a8a8a"
dataframeHeaderBackgroundColor = "#0d0d0d"
dataframeBorderColor = "#262626"
chartCategoricalColors = ["#38bdf8", "#2dd4bf", "#a78bfa", "#f472b6", "#a3e635",
                          "#fbbf24", "#94a3b8", "#fb7185", "#60a5fa", "#c4b5fd"]

[theme.sidebar]
backgroundColor = "#050505"
secondaryBackgroundColor = "#0d0d0d"
borderColor = "#222222"
